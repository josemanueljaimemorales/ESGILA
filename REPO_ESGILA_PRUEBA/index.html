<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESGILA · Plataforma de Gimnasia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="hero">
    <div class="hero-logo"><img src="cliente/logo.png" data-cliente-logo alt="ESGILA"></div>
    <div class="eyebrow" data-cliente-name>ESGILA</div>
    <h1>PLATAFORMA DE <span>GIMNASIA</span></h1>
    <p data-cliente-subtitle>GIMNASIA ARTÍSTICA</p>
  </header>
  <main class="grid">
    <button class="module cyan" data-module="basicos"><b>BÁSICOS</b><small>Elementos y progresiones</small></button>
    <button class="module blue" data-module="sistemas"><b>SISTEMAS</b><small>Sistemas de entrenamiento</small></button>
    <button class="module pink" data-module="fuerza"><b>FUERZA · PREVENTIVO</b><small>Desarrollo y prevención</small></button>
    <button class="module orange" data-module="fuerza-fig"><b>FUERZA FIG</b><small>Preparación física específica</small></button>
    <button class="module purple" data-module="rutinas"><b>RUTINAS</b><small>Rutinas y obligatorios</small></button>
    <button class="module green" data-module="cargas"><b>CARGAS</b><small>Sistemas y fuerzas</small></button>
    <button class="module gold" data-module="gav-training"><b>GAV TRAINING</b><small>Trabajo por grupo y atleta</small></button>
  </main>
  <section id="viewer" class="viewer hidden">
    <button id="back" class="back">← INICIO</button>
    <iframe id="frame" title="Módulo"></iframe>
  </section>
</div>
<script src="cliente/config.js"></script>
<script src="cliente/theme.js"></script>
<script src="script.js"></script>
</body>
</html>
